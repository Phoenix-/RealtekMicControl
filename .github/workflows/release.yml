name: Release

# Pushing a tag like v0.2.0 builds the app and micmode with that version and publishes a GitHub
# release with one zip holding both.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Put vswhere on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\Microsoft Visual Studio\Installer'

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '${{ github.ref_name }}' is not vX.Y.Z" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/RealtekMicControl.Core.Tests -c Release

      # The app first: its payload trim runs after its own publish and would take micmode's
      # leftovers with it otherwise.
      - name: Publish the app (Native AOT)
        run: dotnet publish src/RealtekMicControl.App -c Release -o publish -p:Version=${{ steps.version.outputs.value }}

      - name: Publish micmode (Native AOT)
        run: dotnet publish src/RealtekMicControl.Cli -c Release -o publish -p:Version=${{ steps.version.outputs.value }}

      - name: Package
        shell: pwsh
        run: |
          foreach ($exe in 'RealtekMicControl.exe', 'micmode.exe') {
            if (-not (Test-Path "publish/$exe")) { throw "$exe is missing" }
          }
          Copy-Item README.md, LICENSE publish/
          $zip = "RealtekMicControl-${{ steps.version.outputs.value }}-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV
          Write-Host "$zip -- $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A block scalar: the notes contain ": ", which a plain YAML scalar cannot.
        run: |
          gh release create ${{ github.ref_name }} ${{ env.ZIP }} --title "Realtek Mic Control ${{ steps.version.outputs.value }}" --notes "Native AOT builds for Windows x64, no .NET runtime needed: RealtekMicControl.exe (the window) and micmode.exe (the command line), unzip anywhere. Quick start: set the internal microphone's Audio enhancements to Device default effects, open RealtekMicControl.exe and press Fix if it asks, then pick Cardioid. The README explains why the Fortemedia microphone modes did nothing before."
